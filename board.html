<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게시판 | 우리 반</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7EF;
    --card:#FFFEFA;
    --ink:#55493C;
    --ink-soft:#A0937E;
    --ink-faint:#CBBFA9;
    --line:#EFE7D6;
    --accent:#C9B79C;
    --accent-dark:#A9926F;
    --danger:#B0725E;
    --success:#7A8B6F;
    --serif:'Noto Serif KR', serif;
    --sans:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .hidden{display:none !important;}

  .topbar{max-width:820px;margin:0 auto;padding:30px 24px 4px;position:relative;}
  .home-link{font-size:0.82rem;color:var(--ink-faint);text-decoration:none;}
  .home-link:hover{color:var(--ink-soft);}
  .topbar h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.5rem,3vw + 1rem,2rem);margin:10px 0 4px;}
  .topbar .sub{font-size:0.88rem;color:var(--ink-faint);margin:0;}

  main{max-width:820px;margin:0 auto;padding:22px 24px 90px;}

  .toolbar{display:flex;justify-content:flex-end;margin-bottom:16px;}
  .btn{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:0.86rem;}
  .btn-primary{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
  .btn-primary:hover{background:var(--ink);border-color:var(--ink);}
  .btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}

  .post-list{display:flex;flex-direction:column;gap:12px;}
  .post-card{
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:18px 20px;cursor:pointer;text-align:left;width:100%;
  }
  .post-card:hover{border-color:var(--accent-dark);}
  .post-card h3{font-family:var(--serif);font-weight:500;font-size:1.05rem;margin:0 0 6px;}
  .post-meta{font-size:0.78rem;color:var(--ink-faint);margin-bottom:8px;}
  .post-preview{font-size:0.88rem;color:var(--ink-soft);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .empty{text-align:center;color:var(--ink-faint);padding:60px 20px;font-size:0.9rem;}
  .empty .big{font-size:2rem;margin-bottom:10px;}

  /* ---------- 모달 ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(43,38,32,0.45);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal{
    background:var(--card);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;
    border-radius:4px;padding:26px 24px;position:relative;border:1px solid var(--line);
  }
  .modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:1.3rem;color:var(--ink-faint);line-height:1;}
  .modal h2{font-family:var(--serif);font-weight:500;margin:0 0 6px;font-size:1.3rem;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.8rem;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field textarea{
    width:100%;border:1px solid var(--line);background:#fff;padding:11px 12px;
    font-family:inherit;font-size:0.94rem;border-radius:2px;color:var(--ink);
  }
  .field textarea{min-height:130px;resize:vertical;}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}

  .detail-meta{font-size:0.82rem;color:var(--ink-faint);margin:-2px 0 18px;}
  .detail-body{white-space:pre-wrap;font-size:0.94rem;color:var(--ink);margin-bottom:18px;}
</style>
</head>
<body>

<div class="topbar">
  <a class="home-link" href="index.html">← 홈</a>
  <h1>게시판</h1>
  <p class="sub">반 친구들과 자유롭게 이야기해요</p>
</div>

<main>
  <div class="toolbar">
    <button class="btn btn-primary" id="writeBtn">✎ 글쓰기</button>
  </div>

  <div class="post-list" id="postList"></div>
  <div class="empty hidden" id="emptyState">
    <div class="big">📝</div>
    아직 올라온 글이 없어요.<br>첫 글을 남겨보세요!
  </div>
</main>

<div class="overlay hidden" id="writeOverlay">
  <div class="modal">
    <button class="modal-close" data-close="writeOverlay">×</button>
    <h2 id="writeTitle">글쓰기</h2>
    <form id="writeForm">
      <input type="hidden" id="postId">
      <div class="field"><label for="postTitle">제목</label><input type="text" id="postTitle" required></div>
      <div class="field"><label for="postContent">내용</label><textarea id="postContent" required></textarea></div>
      <div class="form-actions">
        <button type="button" class="btn" data-close="writeOverlay">취소</button>
        <button type="submit" class="btn btn-primary" id="postSubmitBtn">올리기</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay hidden" id="detailOverlay">
  <div class="modal" id="detailContent"></div>
</div>

<script src="common.js"></script>
<script>
  const authState = requireLogin();
  const myLabel = authState && authState.isAdmin
    ? { name: '관리자', role: 'admin', id: '' }
    : (authState && authState.member ? authState.member : null);

  let posts = loadPosts();

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function isMine(post){
    if(!myLabel) return false;
    if(authState.isAdmin) return true; // 관리자는 전부 삭제 가능
    return post.authorRole === myLabel.role && post.authorName === myLabel.name && post.authorId === (myLabel.id || '');
  }
  function formatDate(ts){
    const d = new Date(ts);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }

  function renderPosts(){
    const list = document.getElementById('postList');
    const empty = document.getElementById('emptyState');
    list.innerHTML = '';

    if(posts.length === 0){
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    const sorted = posts.slice().sort((a,b)=> b.createdAt - a.createdAt);
    sorted.forEach(post=>{
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'post-card';
      card.innerHTML = `
        <h3>${escapeHtml(post.title)}</h3>
        <p class="post-meta">${escapeHtml(post.authorName)} · ${formatDate(post.createdAt)}</p>
        <p class="post-preview">${escapeHtml(post.content)}</p>
      `;
      card.addEventListener('click', ()=> openDetail(post.id));
      list.appendChild(card);
    });
  }

  function openDetail(id){
    const post = posts.find(p=>p.id === id);
    if(!post) return;
    const content = document.getElementById('detailContent');
    content.innerHTML = `
      <button class="modal-close" data-close="detailOverlay">×</button>
      <h2>${escapeHtml(post.title)}</h2>
      <p class="detail-meta">${escapeHtml(post.authorName)} · ${formatDate(post.createdAt)}</p>
      <p class="detail-body">${escapeHtml(post.content)}</p>
      ${isMine(post) ? '<div class="form-actions"><button class="btn btn-danger" id="deletePostBtn">삭제</button></div>' : ''}
    `;
    document.querySelectorAll('#detailOverlay [data-close]').forEach(btn=>{
      btn.addEventListener('click', ()=> hideOverlay('detailOverlay'));
    });
    const delBtn = document.getElementById('deletePostBtn');
    if(delBtn){
      delBtn.addEventListener('click', ()=>{
        if(!confirm('이 글을 삭제할까요?')) return;
        posts = posts.filter(p=>p.id !== id);
        savePosts(posts);
        hideOverlay('detailOverlay');
        renderPosts();
      });
    }
    showOverlay('detailOverlay');
  }

  function showOverlay(id){ document.getElementById(id).classList.remove('hidden'); }
  function hideOverlay(id){ document.getElementById(id).classList.add('hidden'); }
  document.querySelectorAll('[data-close]').forEach(btn=>{
    btn.addEventListener('click', ()=> hideOverlay(btn.dataset.close));
  });
  document.querySelectorAll('.overlay').forEach(ov=>{
    ov.addEventListener('click', (e)=>{ if(e.target === ov) hideOverlay(ov.id); });
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      document.querySelectorAll('.overlay').forEach(ov=>{ if(!ov.classList.contains('hidden')) hideOverlay(ov.id); });
    }
  });

  document.getElementById('writeBtn').addEventListener('click', ()=>{
    document.getElementById('writeForm').reset();
    document.getElementById('postId').value = '';
    document.getElementById('writeTitle').textContent = '글쓰기';
    updatePostReady();
    showOverlay('writeOverlay');
  });

  const updatePostReady = wireReadyButton(
    document.getElementById('postSubmitBtn'),
    ()=> document.getElementById('writeForm').checkValidity(),
    [document.getElementById('postTitle'), document.getElementById('postContent')]
  );

  document.getElementById('writeForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const title = document.getElementById('postTitle').value.trim();
    const content = document.getElementById('postContent').value.trim();
    if(!title || !content) return;

    posts.push({
      id: 'p' + Date.now(),
      title,
      content,
      authorName: myLabel.name,
      authorRole: myLabel.role,
      authorId: myLabel.id || '',
      createdAt: Date.now()
    });
    savePosts(posts);
    hideOverlay('writeOverlay');
    renderPosts();
  });

  renderPosts();
</script>
</body>
</html>
