<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 페이지 | 우리 반 책장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7EF;
    --card:#FFFEFA;
    --ink:#55493C;
    --ink-soft:#A0937E;
    --ink-faint:#CBBFA9;
    --line:#EFE7D6;
    --accent:#C9B79C;
    --accent-dark:#A9926F;
    --danger:#B0725E;
    --serif:'Noto Serif KR', serif;
    --sans:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:20px;
  }
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .box{
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:38px 32px;max-width:400px;width:100%;
  }
  .box h1{font-family:var(--serif);font-weight:500;font-size:1.5rem;margin:0 0 6px;text-align:center;}
  .box p.sub{font-size:0.86rem;color:var(--ink-faint);margin:0 0 28px;text-align:center;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.8rem;color:var(--ink-soft);margin-bottom:6px;}
  .field input{
    width:100%;border:1px solid var(--line);background:#fff;padding:11px 12px;
    font-family:inherit;font-size:0.95rem;border-radius:2px;color:var(--ink);
  }
  .error{font-size:0.8rem;color:var(--danger);margin:-6px 0 14px;display:none;}
  .success{font-size:0.8rem;color:#5C7A5E;margin:-6px 0 14px;display:none;}
  .form-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{flex:1;padding:11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:0.88rem;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .back{display:block;text-align:center;margin-top:22px;font-size:0.82rem;color:var(--ink-faint);text-decoration:none;}
  .back:hover{color:var(--ink-soft);}
</style>
</head>
<body>

<div class="box">
  <h1>내 페이지</h1>
  <p class="sub">여기서 비밀번호를 바꿀 수 있어요.<br>다른 기능은 앞으로 하나씩 추가할 예정이에요.</p>
  <form id="pwForm">
    <div class="field"><label for="pwOld">현재 비밀번호</label><input type="password" id="pwOld" required></div>
    <div class="field"><label for="pw1">새 비밀번호</label><input type="password" id="pw1" required minlength="2"></div>
    <div class="field"><label for="pw2">새 비밀번호 확인</label><input type="password" id="pw2" required minlength="2"></div>
    <p class="error" id="pwError"></p>
    <p class="success" id="pwSuccess">비밀번호가 변경되었어요.</p>
    <div class="form-actions">
      <button type="button" class="btn" id="logoutBtn">로그아웃</button>
      <button type="submit" class="btn btn-primary">변경하기</button>
    </div>
  </form>
  <a class="back" href="index.html">← 책장으로 돌아가기</a>
</div>

<script>
  const LS_PW = 'rk_admin_pw';

  if(localStorage.getItem('rk_logged_in') !== 'true'){
    location.href = 'login.html';
  }

  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    localStorage.removeItem('rk_logged_in');
    location.href = 'index.html';
  });

  document.getElementById('pwForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const oldPw = document.getElementById('pwOld').value;
    const p1 = document.getElementById('pw1').value;
    const p2 = document.getElementById('pw2').value;
    const err = document.getElementById('pwError');
    const ok = document.getElementById('pwSuccess');
    err.style.display = 'none';
    ok.style.display = 'none';

    if(oldPw !== localStorage.getItem(LS_PW)){
      err.textContent = '현재 비밀번호가 맞지 않아요.';
      err.style.display = 'block';
      return;
    }
    if(p1 !== p2){
      err.textContent = '새 비밀번호가 서로 달라요. 다시 입력해주세요.';
      err.style.display = 'block';
      return;
    }
    localStorage.setItem(LS_PW, p1);
    document.getElementById('pwForm').reset();
    ok.style.display = 'block';
  });
</script>
</body>
</html>
