<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 페이지 | 우리 반 책장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7EF;
    --card:#FFFEFA;
    --ink:#55493C;
    --ink-soft:#A0937E;
    --ink-faint:#CBBFA9;
    --line:#EFE7D6;
    --accent:#C9B79C;
    --accent-dark:#A9926F;
    --danger:#B0725E;
    --success:#7A8B6F;
    --serif:'Noto Serif KR', serif;
    --sans:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  .hidden{display:none !important;}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--sans);
  }
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  a{color:inherit;}

  /* ---------- 공통 ---------- */
  .center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .box{
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:38px 32px;max-width:400px;width:100%;
  }
  .box h1{font-family:var(--serif);font-weight:500;font-size:1.5rem;margin:0 0 6px;text-align:center;}
  .box p.sub{font-size:0.86rem;color:var(--ink-faint);margin:0 0 28px;text-align:center;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.8rem;color:var(--ink-soft);margin-bottom:6px;}
  .field input{
    width:100%;border:1px solid var(--line);background:#fff;padding:11px 12px;
    font-family:inherit;font-size:0.95rem;border-radius:2px;color:var(--ink);
  }
  .error{font-size:0.8rem;color:var(--danger);margin:-6px 0 14px;display:none;}
  .success{font-size:0.8rem;color:var(--success);margin:-6px 0 14px;display:none;}
  .form-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:0.86rem;}
  .btn-primary{background:var(--line);border-color:var(--line);color:var(--ink-faint);cursor:not-allowed;}
  .btn-primary.is-ready{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;cursor:pointer;}
  .btn-primary.is-ready:hover{background:var(--ink);border-color:var(--ink);}
  .back{display:block;text-align:center;margin-top:22px;font-size:0.82rem;color:var(--ink-faint);text-decoration:none;}
  .back:hover{color:var(--ink-soft);}

  /* ---------- 회원용 레이아웃 (탭 구조) ---------- */
  .page{max-width:760px;margin:0 auto;padding:34px 22px 60px;}
  .page-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;}
  .page-top h1{font-family:var(--serif);font-weight:500;font-size:1.6rem;margin:0;}
  .page-top a.back{margin:0;font-size:0.82rem;}

  .layout{display:flex;gap:28px;align-items:flex-start;}
  .tabs{
    display:flex;flex-direction:column;gap:4px;width:150px;flex-shrink:0;
  }
  .tab-btn{
    text-align:left;background:none;border:none;padding:10px 14px;border-radius:4px;
    font-size:0.9rem;color:var(--ink-soft);
  }
  .tab-btn.active{background:var(--card);color:var(--ink);font-weight:600;border:1px solid var(--line);}
  .tab-btn:disabled{color:var(--ink-faint);cursor:default;}

  .panel{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:28px;
  }
  .panel h2{font-family:var(--serif);font-weight:500;font-size:1.15rem;margin:0 0 4px;}
  .panel .desc{font-size:0.82rem;color:var(--ink-faint);margin:0 0 22px;}
  .section{padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid var(--line);}
  .section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .section h3{font-size:0.85rem;color:var(--ink-soft);margin:0 0 14px;font-weight:600;}

  .avatar-row{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
  .avatar-preview{
    width:64px;height:64px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:var(--serif);font-size:1.3rem;color:var(--accent-dark);flex-shrink:0;
  }
  .avatar-preview img{width:100%;height:100%;object-fit:cover;}

  .info-line{font-size:0.85rem;color:var(--ink-soft);margin-bottom:2px;}
  .info-line b{color:var(--ink);}

  @media (max-width:560px){
    .layout{flex-direction:column;}
    .tabs{flex-direction:row;width:100%;overflow-x:auto;}
  }
</style>
</head>
<body>

<!-- ===== 관리자 화면 ===== -->
<div class="center-wrap hidden" id="adminView">
  <div class="box">
    <h1>내 페이지</h1>
    <p class="sub">관리자 계정이에요. 여기서 관리자 비밀번호를 바꿀 수 있어요.</p>
    <form id="adminPwForm">
      <div class="field"><label for="aPwOld">현재 비밀번호</label><input type="password" id="aPwOld" required></div>
      <div class="field"><label for="aPw1">새 비밀번호</label><input type="password" id="aPw1" required minlength="2"></div>
      <div class="field"><label for="aPw2">새 비밀번호 확인</label><input type="password" id="aPw2" required minlength="2"></div>
      <p class="error" id="aPwError"></p>
      <p class="success" id="aPwSuccess">비밀번호가 변경되었어요.</p>
      <div class="form-actions">
        <button type="button" class="btn" id="adminLogoutBtn">로그아웃</button>
        <button type="submit" class="btn btn-primary" id="adminPwSubmitBtn" style="flex:1;">변경하기</button>
      </div>
    </form>
    <a class="back" href="index.html">← 홈으로 돌아가기</a>
  </div>
</div>

<!-- ===== 회원(학생/선생님) 화면 ===== -->
<div class="page hidden" id="memberView">
  <div class="page-top">
    <h1>내 페이지</h1>
    <a class="back" href="index.html">← 홈으로 돌아가기</a>
  </div>

  <div class="layout">
    <div class="tabs">
      <button class="tab-btn active" id="tabAccountBtn">계정</button>
      <button class="tab-btn" disabled title="곧 추가돼요">내 활동</button>
      <button class="tab-btn" disabled title="곧 추가돼요">설정</button>
    </div>

    <div class="panel" id="accountPanel">
      <h2>계정</h2>
      <p class="desc" id="memberInfoLine"></p>

      <div class="section">
        <h3>아이디 (게시글에 표시될 이름)</h3>
        <div class="field">
          <input type="text" id="nicknameInput">
        </div>
        <p class="error" id="nicknameError"></p>
        <p class="success" id="nicknameSuccess">저장했어요.</p>
        <button type="button" class="btn btn-primary" id="nicknameSaveBtn">저장</button>
      </div>

      <div class="section">
        <h3>프로필 사진</h3>
        <div class="avatar-row">
          <div class="avatar-preview" id="avatarPreview"></div>
          <input type="file" id="photoInput" accept="image/*">
        </div>
        <p class="error" id="photoError"></p>
        <p class="success" id="photoSuccess">사진을 저장했어요.</p>
        <button type="button" class="btn btn-primary" id="photoSaveBtn">사진 저장</button>
      </div>

      <div class="section">
        <h3>비밀번호 변경</h3>
        <form id="memberPwForm">
          <div class="field"><label for="mPwOld">현재 비밀번호</label><input type="password" id="mPwOld" required></div>
          <div class="field"><label for="mPw1">새 비밀번호</label><input type="password" id="mPw1" required minlength="2"></div>
          <div class="field"><label for="mPw2">새 비밀번호 확인</label><input type="password" id="mPw2" required minlength="2"></div>
          <p class="error" id="mPwError"></p>
          <p class="success" id="mPwSuccess">비밀번호가 변경되었어요.</p>
          <button type="submit" class="btn btn-primary" id="memberPwSubmitBtn">변경하기</button>
        </form>
      </div>

      <div class="section">
        <button type="button" class="btn" id="memberLogoutBtn">로그아웃</button>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
  const isAdmin = localStorage.getItem(LS_LOGGED_IN) === 'true';
  const member = isAdmin ? null : getCurrentMemberFull();

  if(!isAdmin && !member){
    location.href = 'login.html';
  }

  if(isAdmin){
    document.getElementById('adminView').classList.remove('hidden');
  }else{
    document.getElementById('memberView').classList.remove('hidden');
    initMemberView();
  }

  /* ---------- 관리자 비밀번호 변경 ---------- */
  document.getElementById('adminLogoutBtn').addEventListener('click', ()=>{
    localStorage.removeItem(LS_LOGGED_IN);
    location.href = 'index.html';
  });
  wireReadyButton(
    document.getElementById('adminPwSubmitBtn'),
    ()=> document.getElementById('adminPwForm').checkValidity(),
    [document.getElementById('aPwOld'), document.getElementById('aPw1'), document.getElementById('aPw2')]
  );
  document.getElementById('adminPwForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const oldPw = document.getElementById('aPwOld').value;
    const p1 = document.getElementById('aPw1').value;
    const p2 = document.getElementById('aPw2').value;
    const err = document.getElementById('aPwError');
    const ok = document.getElementById('aPwSuccess');
    err.style.display = 'none'; ok.style.display = 'none';

    if(oldPw !== localStorage.getItem(LS_PW)){
      err.textContent = '현재 비밀번호가 맞지 않아요.'; err.style.display = 'block'; return;
    }
    if(p1 !== p2){
      err.textContent = '새 비밀번호가 서로 달라요. 다시 입력해주세요.'; err.style.display = 'block'; return;
    }
    localStorage.setItem(LS_PW, p1);
    document.getElementById('adminPwForm').reset();
    ok.style.display = 'block';
  });

  /* ---------- 회원(학생/선생님) 화면 ---------- */
  function initMemberView(){
    const roleLabel = member.role === 'teacher' ? '선생님' : '학생';
    const idPart = member.role === 'student' ? (member.id + ' · ') : '';
    document.getElementById('memberInfoLine').textContent = `${roleLabel} · ${idPart}${member.name}`;

    document.getElementById('nicknameInput').value = member.nickname || member.name;
    renderAvatar(member.photo);

    wireReadyButton(
      document.getElementById('nicknameSaveBtn'),
      ()=> !!document.getElementById('nicknameInput').value.trim(),
      [document.getElementById('nicknameInput')]
    );
    const updatePhotoReady = wireReadyButton(
      document.getElementById('photoSaveBtn'),
      ()=> !!document.querySelector('#avatarPreview img'),
      []
    );
    wireReadyButton(
      document.getElementById('memberPwSubmitBtn'),
      ()=> document.getElementById('memberPwForm').checkValidity(),
      [document.getElementById('mPwOld'), document.getElementById('mPw1'), document.getElementById('mPw2')]
    );

    document.getElementById('memberLogoutBtn').addEventListener('click', ()=>{
      clearCurrentMember();
      location.href = 'index.html';
    });

    document.getElementById('nicknameSaveBtn').addEventListener('click', ()=>{
      const val = document.getElementById('nicknameInput').value.trim();
      const err = document.getElementById('nicknameError');
      const ok = document.getElementById('nicknameSuccess');
      err.style.display = 'none'; ok.style.display = 'none';
      if(!val){
        err.textContent = '아이디(표시 이름)를 입력해주세요.';
        err.style.display = 'block';
        return;
      }
      updateCurrentMember({ nickname: val });
      ok.style.display = 'block';
    });

    document.getElementById('photoInput').addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{ renderAvatar(reader.result); updatePhotoReady(); };
      reader.readAsDataURL(file);
    });

    document.getElementById('photoSaveBtn').addEventListener('click', ()=>{
      const img = document.querySelector('#avatarPreview img');
      const err = document.getElementById('photoError');
      const ok = document.getElementById('photoSuccess');
      err.style.display = 'none'; ok.style.display = 'none';
      if(!img){
        err.textContent = '먼저 사진을 선택해주세요.';
        err.style.display = 'block';
        return;
      }
      updateCurrentMember({ photo: img.src });
      ok.style.display = 'block';
    });

    document.getElementById('memberPwForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const oldPw = document.getElementById('mPwOld').value;
      const p1 = document.getElementById('mPw1').value;
      const p2 = document.getElementById('mPw2').value;
      const err = document.getElementById('mPwError');
      const ok = document.getElementById('mPwSuccess');
      err.style.display = 'none'; ok.style.display = 'none';

      const current = getCurrentMemberFull();
      const currentPw = current.password || DEFAULT_STUDENT_PW;
      if(oldPw !== currentPw){
        err.textContent = '현재 비밀번호가 맞지 않아요.'; err.style.display = 'block'; return;
      }
      if(p1 !== p2){
        err.textContent = '새 비밀번호가 서로 달라요. 다시 입력해주세요.'; err.style.display = 'block'; return;
      }
      updateCurrentMember({ password: p1 });
      document.getElementById('memberPwForm').reset();
      ok.style.display = 'block';
    });
  }

  function renderAvatar(photo){
    const box = document.getElementById('avatarPreview');
    box.innerHTML = '';
    if(photo){
      const img = document.createElement('img');
      img.src = photo;
      box.appendChild(img);
    }else{
      box.textContent = member.name ? member.name.charAt(0) : '?';
    }
  }
</script>
</body>
</html>
