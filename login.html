<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 우리 반 책장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7EF;
    --card:#FFFEFA;
    --ink:#55493C;
    --ink-soft:#A0937E;
    --ink-faint:#CBBFA9;
    --line:#EFE7D6;
    --accent:#C9B79C;
    --accent-dark:#A9926F;
    --danger:#B0725E;
    --success:#7A8B6F;
    --serif:'Noto Serif KR', serif;
    --sans:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:24px;
  }
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .box{
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:36px 32px;max-width:380px;width:100%;
  }
  .box h1{font-family:var(--serif);font-weight:500;font-size:1.5rem;margin:0 0 6px;text-align:center;}
  .box p.sub{font-size:0.86rem;color:var(--ink-faint);margin:0 0 26px;text-align:center;}

  .field{margin-bottom:14px;text-align:left;}
  .field label{display:block;font-size:0.8rem;color:var(--ink-soft);margin-bottom:6px;}
  .field input{
    width:100%;border:1px solid var(--line);background:#fff;padding:11px 12px;
    font-family:inherit;font-size:0.95rem;border-radius:2px;color:var(--ink);
  }
  .error{font-size:0.8rem;color:var(--danger);margin:-4px 0 12px;display:none;text-align:left;}
  .success{font-size:0.8rem;color:var(--success);margin:-4px 0 12px;display:none;text-align:left;}
  .btn-primary{
    width:100%;padding:12px;border-radius:999px;border:none;
    background:var(--accent);color:#fff;font-size:0.92rem;margin-top:2px;
  }
  .btn-primary:hover{background:var(--accent-dark);}

  .admin-toggle{
    display:block;width:100%;text-align:center;background:none;border:none;
    font-size:0.78rem;color:var(--ink-faint);margin-top:14px;text-decoration:underline;
  }
  .admin-toggle:hover{color:var(--ink-soft);}
  .admin-panel{
    display:none;margin-top:12px;padding-top:14px;border-top:1px dashed var(--line);
  }
  .admin-panel.open{display:block;}

  .divider{
    display:flex;align-items:center;gap:10px;margin:26px 0 18px;
    font-size:0.76rem;color:var(--ink-faint);
  }
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}

  .role-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .role-btn{
    flex:1;padding:9px;border-radius:999px;border:1px solid var(--line);background:#fff;
    font-size:0.85rem;color:var(--ink-soft);
  }
  .role-btn.active{background:var(--ink); border-color:var(--ink); color:#fff;}

  .signup-fields{display:none;}
  .signup-fields.open{display:block;}

  .back{display:block;text-align:center;margin-top:22px;font-size:0.82rem;color:var(--ink-faint);text-decoration:none;}
  .back:hover{color:var(--ink-soft);}
</style>
</head>
<body>

<div class="box">
  <h1>로그인</h1>
  <p class="sub">우리 반 책장</p>

  <form id="loginForm">
    <div class="field">
      <label for="loginId">학번</label>
      <input type="text" id="loginId" inputmode="numeric" placeholder="예: 10203">
    </div>
    <div class="field">
      <label for="loginName">이름</label>
      <input type="text" id="loginName" required>
    </div>
    <div class="field">
      <label for="loginPw">비밀번호</label>
      <input type="password" id="loginPw" required>
    </div>
    <p class="error" id="loginError"></p>
    <button type="submit" class="btn-primary">로그인</button>
  </form>

  <button type="button" class="admin-toggle" id="adminToggle">관리자이신가요?</button>
  <div class="admin-panel" id="adminPanel">
    <form id="adminForm">
      <div class="field">
        <label for="adminPw">관리자 비밀번호</label>
        <input type="password" id="adminPw" required>
      </div>
      <p class="error" id="adminError">비밀번호가 틀렸어요.</p>
      <button type="submit" class="btn-primary">관리자로 로그인</button>
    </form>
  </div>

  <div class="divider">또는</div>

  <a class="btn-primary" style="display:block;text-decoration:none;text-align:center;box-sizing:border-box;" href="signup.html">회원가입</a>

  <a class="back" href="index.html">← 책장으로 돌아가기</a>
</div>

<script src="common.js"></script>
<script>
  /* ---------- 일반 로그인 (학번 + 이름 + 비밀번호) ---------- */
  document.getElementById('loginForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const id = document.getElementById('loginId').value.trim();
    const name = document.getElementById('loginName').value.trim();
    const pw = document.getElementById('loginPw').value;
    const err = document.getElementById('loginError');
    err.style.display = 'none';

    if(pw !== localStorage.getItem(LS_STUDENT_PW)){
      err.textContent = '비밀번호가 틀렸어요.';
      err.style.display = 'block';
      return;
    }
    const member = findApprovedMember(name, id);
    if(!member){
      err.textContent = '가입 승인이 안 됐거나, 학번·이름이 일치하지 않아요.';
      err.style.display = 'block';
      return;
    }
    setCurrentMember({ id: member.id, name: member.name, role: member.role, photo: member.photo || '' });
    location.href = 'index.html';
  });

  /* ---------- 관리자 모드 ---------- */
  const adminToggle = document.getElementById('adminToggle');
  const adminPanel = document.getElementById('adminPanel');
  adminToggle.addEventListener('click', ()=>{
    adminPanel.classList.toggle('open');
  });
  document.getElementById('adminForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const pw = document.getElementById('adminPw').value;
    const err = document.getElementById('adminError');
    if(pw === localStorage.getItem(LS_PW)){
      try{ localStorage.setItem(LS_LOGGED_IN, 'true'); }catch(err2){}
      location.href = 'index.html';
    }else{
      err.style.display = 'block';
    }
  });
</script>
</body>
</html>
